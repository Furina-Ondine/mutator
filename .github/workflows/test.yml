name: Test

on: [push, pull_request]

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: mutator
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/crapper
          path: crapper
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e "mutator[dev]"
      - run: python -m pytest -q
        working-directory: mutator
